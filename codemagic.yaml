workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Initialize Flutter Project Structure
        script: |
          flutter create . --org com.example.doorinstaller --project-name door_installer
      - name: Get flutter packages
        script: flutter packages get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
